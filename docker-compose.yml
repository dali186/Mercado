version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysqladmin
    ports:
      - "3306:3306"
    networks:
      - mercado_net
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  mercado-was:
    build:
      context: .  # Dockerfile이 있는 디렉토리 (현재 디렉토리로 설정)
    container_name: mercado_was
    ports:
      - "8080:8080"
    networks:
      - mercado_net
    depends_on:
      - mysql
    restart: unless-stopped

networks:
  mercado_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local