# Workflow 이름
name: Integration with Gradle

# 브랜치 지정
on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize  # PR에 커밋이 푸시될 때마다 실행

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Repository Checkout
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.head_ref }}
    
    # Java Setting
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    
    # gradlew 권한 부여
    - name: Grant gradlew
      run: chmod +x gradlew
    
    # WAS Gradle 빌드
    - name: Build with Gradle
      run: ./gradlew clean build -x test

    # 도커 로그인
    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Docker 이미지 빌드
    - name: Build Docker Image
      run: |
        docker build --no-cache -t kizm2wn/mercado-was:latest .

    # DockerHub에 푸시
    - name: Push Docker Image to DockerHub
      run: |
        docker push kizm2wn/mercado-was:latest
    
    # 배포
    - name: Deploy Images with Docker Compose
      uses: appleboy/ssh-action@master
      env:
        APP: "Mercado"
        COMPOSE: "/home/mercado/compose/docker-compose.yml"
      with:
        username: mercado
        host: ${{ secrets.AZURE_HOST }}
        key: ${{ secrets.AZURE_PRIVATE_KEY }}
        envs: APP, COMPOSE
        script_stop: true
        script: |
          echo "Stopping existing containers..."
          sudo docker-compose -f $COMPOSE down
          
          echo "Starting containers with Docker Compose..."
          sudo docker-compose -f $COMPOSE up -d
          
          echo "Deployment completed successfully."
